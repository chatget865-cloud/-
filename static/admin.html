<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة عُمان المجد</title><link rel="stylesheet" href="/static/style.css?v=3"></head><body><header class="top"><div class="brand"><div class="brand-mark">عُ</div><span>إدارة عُمان المجد<small>تحدي المعرفة الوطنية</small></span></div><a href="/">صفحة المسابقة</a></header><main class="container"><section class="panel admin-panel"><h1>إدارة المسابقة</h1><label>كلمة مرور الإدارة<input id="password" type="password" placeholder="كلمة مرور الإدارة" autocomplete="off"></label><div class="actions" style="margin:18px 0"><button class="secondary" id="refresh">تحديث البيانات</button><button class="primary" id="open">فتح المسابقة</button><button class="secondary" id="close">إغلاق المسابقة وإعلان الترتيب</button></div><p id="state"></p><hr><h2>نتائج المشاركين</h2><p class="notice">الدخول بالاسم وجهة العمل فقط. يمكن وضع علامة «تجريبي» على أي مشاركة لاستبعادها من ترتيب الفائزين دون حذف بياناتها.</p><button class="secondary" id="export">تصدير CSV لفتحه في Excel</button><div style="overflow:auto" id="table"></div><p id="error" class="message"></p></section></main><footer><div class="creator-credit" aria-label="إعداد وتصميم رقية علي الفارسي، فني دعم أجهزة مدرسية"><span class="credit-label">إعداد وتصميم</span><strong>رقية علي الفارسي</strong><span class="credit-role">فني دعم أجهزة مدرسية</span></div></footer><script src="/static/admin.js?v=3"></script></body></html>
