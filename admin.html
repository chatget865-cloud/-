<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مسابقة عُمان المجد</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="top"><div class="brand">🇴🇲 لوحة إدارة عُمان المجد</div><a href="/">صفحة المسابقة</a></header><main class="container"><section class="panel"><h1>إدارة المسابقة</h1><label>كلمة مرور الإدارة<input id="password" type="password" placeholder="كلمة مرور الإدارة"></label><div class="actions" style="margin:16px 0"><button class="secondary" id="refresh">تحديث البيانات</button><button class="primary" id="open">فتح المسابقة</button><button class="secondary" id="close">إغلاق المسابقة وإعلان الترتيب</button></div><p id="state"></p><hr><h2>رموز المشاركة</h2><label>عدد الرموز<input type="number" id="count" min="1" max="500" value="30"></label><button class="primary" id="generate">توليد الرموز</button><textarea id="tokens" rows="7" style="width:100%;margin-top:12px;direction:ltr" readonly></textarea><p class="hint">احفظ الرموز ووزع رمزًا واحدًا على كل مشارك. لا تشارك كلمة مرور الإدارة.</p><hr><h2>نتائج المشاركين</h2><button class="secondary" id="export">تصدير CSV لفتحه في Excel</button><div style="overflow:auto" id="table"></div><p id="error" class="message"></p></section></main><script src="/static/admin.js"></script></body></html>
